dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  # 节点域名本身用这条解析，避免「DNS 走代理、代理又等 DNS」的循环。
  default-nameserver:
    - tls://1.1.1.1
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
  nameserver:
    - "https://cloudflare-dns.com/dns-query#PROXY"
  fallback:
    - "https://cloudflare-dns.com/dns-query#PROXY"
  fallback-filter:
    geoip: false
  nameserver-policy:
    "+._dns-sd._udp.0.55.211.10.in-addr.arpa": system
    "+._dns-sd._udp.0.97.168.192.in-addr.arpa": system
    "+._dns-sd._udp.0.129.37.10.in-addr.arpa": system
    "+._dns-sd._udp.0.138.168.192.in-addr.arpa": system
    "+._dns-sd._udp.0.168.168.192.in-addr.arpa": system
    "+.in-addr.arpa": system
    "+.ip6.arpa": system
    "+.local": system
    "+.apple-cloudkit.com": system
    "+.cdn-apple.com": system
    "+.icloud-content.com": system

hosts:
  "localhost.weixin.qq.com": "127.0.0.1"
  "localhost": "127.0.0.1"
