# Clash Meta 配置，由 Shadowrocket.conf 生成。
# 给 Clash Verge、Mihomo Party、Stash 这类 Mihomo 内核使用。
# 文件里没有节点。导入后在 PROXY 组选择节点，这就是小火箭首页当前节点。
#
# 没有照搬的部分：
# - google.cn / g.cn 不能 302 到 google.com，这两条域名改走「谷歌服务」。
# - 名单中的 USER-AGENT、URL-REGEX 会被 Clash 跳过。
# - 没有拦截代理连接的 QUIC，避免把国内 UDP/443 一起拒绝。
# - 不在这里打开 TUN，也不占用 53 端口。客户端打开 TUN 后才等同于小火箭的整机劫持。
mode: rule
ipv6: false

# 把订阅填进 url，并删掉每一行行首的 # ，节点会进入 PROXY 和地区组。
# proxy-providers:
#   subscription:
#     type: http
#     url: "https://example.com/replace-with-your-subscription"
#     interval: 86400
#     path: ./providers/subscription.yaml
#     health-check:
#       enable: true
#       url: http://www.gstatic.com/generate_204
#       interval: 600

proxy-groups:
  # 这里只放订阅里的节点，默认就是第一个节点。地区组在下面，需要时再选。
  - name: "PROXY"
    type: select
    include-all: true

  - name: "🚀 节点选择"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"
      - "REJECT"
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🌐 其他节点"

  - name: "🇭🇰 香港节点"
    type: url-test
    include-all: true
    filter: "🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港"
    exclude-filter: '(?:(?:^|[^0-9.])(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)\s*[xX×ｘＸ倍]|(?:^|[^0-9.xX×ｘＸ])[xX×ｘＸ]\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)|(?:^|[^0-9.])倍率\s*[:：=]?\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*))'
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 0
    timeout: 5000
    lazy: true

  - name: "🇹🇼 台湾节点"
    type: url-test
    include-all: true
    filter: "🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化"
    exclude-filter: '(?:(?:^|[^0-9.])(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)\s*[xX×ｘＸ倍]|(?:^|[^0-9.xX×ｘＸ])[xX×ｘＸ]\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)|(?:^|[^0-9.])倍率\s*[:：=]?\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*))'
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 0
    timeout: 5000
    lazy: true

  - name: "🇯🇵 日本节点"
    type: url-test
    include-all: true
    filter: "🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪"
    exclude-filter: '(?:(?:^|[^0-9.])(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)\s*[xX×ｘＸ倍]|(?:^|[^0-9.xX×ｘＸ])[xX×ｘＸ]\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)|(?:^|[^0-9.])倍率\s*[:：=]?\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*))'
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 0
    timeout: 5000
    lazy: true

  - name: "🇺🇸 美国节点"
    type: url-test
    include-all: true
    filter: "🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美"
    exclude-filter: '(?:(?:^|[^0-9.])(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)\s*[xX×ｘＸ倍]|(?:^|[^0-9.xX×ｘＸ])[xX×ｘＸ]\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)|(?:^|[^0-9.])倍率\s*[:：=]?\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*))'
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 0
    timeout: 5000
    lazy: true

  - name: "🌐 其他节点"
    type: url-test
    include-all: true
    exclude-filter: '🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港|🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化|🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美|(?:(?:(?:^|[^0-9.])(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)\s*[xX×ｘＸ倍]|(?:^|[^0-9.xX×ｘＸ])[xX×ｘＸ]\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)|(?:^|[^0-9.])倍率\s*[:：=]?\s*(?:[1-9]\d+(?:\.\d+)?|[2-9](?:\.\d+)?|1\.\d*[1-9]\d*)))'
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 0
    timeout: 5000
    lazy: true

  - name: "🧱 DNS 防泄露"
